name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # dtolnay/rust-toolchain has no numbered releases; the ref is the
      # toolchain it installs, and "stable" is the moving one we target.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check the formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      # Tests run in release: the geometry is slow enough in a debug build to
      # matter, and release is what the packages ship. The tests that need the
      # private gerber fixtures skip themselves when they are not in the tree,
      # and tests/render_examples.rs is #[ignore].
      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Run the binary
        run: |
          ./target/release/stencicrity --version
          ./target/release/stencicrity --help > /dev/null

  # The two package jobs below mirror the ones in release.yml, minus the
  # version check, the artifact upload and the release attachment: this is
  # only here so that a change to packaging/ is caught by the pull request
  # that makes it, rather than by the release that needs it.
  arch-package:
    name: Arch package
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      # git has to be there before actions/checkout, and makepkg needs its
      # dependencies installed beforehand: "makepkg -s" would call pacman
      # through sudo from the unprivileged build user.
      - name: Install the toolchain
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git rust sudo

      - uses: actions/checkout@v4

      - name: Prepare the build user
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder

      - name: Build the package
        run: |
          set -eu
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "building $VERSION"
          git archive --prefix="stencicrity-$VERSION/" \
            -o "packaging/arch/stencicrity-$VERSION.tar.gz" HEAD
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" packaging/arch/PKGBUILD
          # makepkg refuses to run as root.
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd packaging/arch
          sudo -u builder makepkg -f --noconfirm

      - name: Inspect and install the package
        run: |
          set -eu
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          cd packaging/arch
          pacman -Qip stencicrity-"$VERSION"-1-x86_64.pkg.tar.zst
          pacman -U --noconfirm stencicrity-"$VERSION"-1-x86_64.pkg.tar.zst
          stencicrity --version
          stencicrity --help > /dev/null

  deb-package:
    name: Debian package
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
      DEBEMAIL: lucaci32u4@gmail.com
      DEBFULLNAME: lucaci32u4
    steps:
      - name: Install the toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts git curl ca-certificates

      # Trixie's rustc is exactly 1.85, the crate's minimum; build against the
      # same stable toolchain the developers use instead of living on that
      # edge. This is why debian/control build-depends on debhelper only and
      # why the build below passes -d.
      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      # dpkg-buildpackage only looks for ./debian, but the packaging lives in
      # packaging/debian next to the Arch PKGBUILD. Stage a copy for the build.
      - name: Stage the Debian packaging
        run: cp -a packaging/debian debian

      - name: Set the changelog version
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$(dpkg-parsechangelog -S Version)" = "$VERSION-1" ]; then
            echo "debian/changelog is already at $VERSION-1"
          else
            dch --newversion "$VERSION-1" --distribution unstable \
                --force-bad-version "Release $VERSION"
          fi
          dpkg-parsechangelog

      # -d because cargo comes from rustup and is not a dpkg-installed
      # build-dependency; see packaging/debian/README.Debian.
      - name: Build the package
        run: dpkg-buildpackage -us -uc -b -d

      - name: Inspect and install the package
        run: |
          set -eu
          mkdir -p out
          mv ../stencicrity_*.deb out/
          dpkg-deb -I out/*.deb
          dpkg-deb -c out/*.deb
          apt-get install -y --no-install-recommends ./out/*.deb
          stencicrity --version
          stencicrity --help > /dev/null
