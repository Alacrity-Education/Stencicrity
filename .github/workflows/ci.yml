name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run the console script
        run: |
          stencicrity --version
          stencicrity --help

      - name: Byte-compile the package
        run: python -m compileall pcbstencil

      - name: Build the wheel and the sdist
        run: |
          pip install build
          python -m build
