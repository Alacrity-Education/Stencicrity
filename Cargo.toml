[package]
name = "stencicrity"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Merge KiCad paste/copper gerbers of several projects into one stencil order"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Alacrity-Education/Stencicrity"
readme = "README.md"
keywords = ["kicad", "gerber", "stencil", "smd", "pcb"]
categories = ["command-line-utilities", "science"]
default-run = "stencicrity"

[dependencies]
geo = "0.33"
geo-types = "0.7"
i_overlay = "9"
rstar = "0.13"
tiny-skia = "0.12"
ab_glyph = "0.2"
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4.6", features = ["derive"] }
zip = { version = "6", default-features = false, features = ["deflate"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
