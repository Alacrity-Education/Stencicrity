[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stencicrity"
dynamic = ["version"]
description = "Merge KiCad paste/copper gerbers of several projects into one stencil order"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "lucaci32u4", email = "lucaci32u4@gmail.com" },
]
keywords = ["kicad", "gerber", "stencil", "solder-paste", "pcb", "smt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: Manufacturing",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "shapely>=2.0",
    "pillow>=10.1",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/Alacrity-Education/Stencicrity"
Source = "https://github.com/Alacrity-Education/Stencicrity"
Issues = "https://github.com/Alacrity-Education/Stencicrity/issues"

[project.scripts]
stencicrity = "pcbstencil.cli:main"

[tool.setuptools]
packages = ["pcbstencil"]

[tool.setuptools.dynamic]
version = { attr = "pcbstencil.__version__" }
